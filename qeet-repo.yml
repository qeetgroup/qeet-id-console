# qeet-id-console — repository context metadata (Level 2).
# Inherits qeetgroup/qeet-context (L0) and qeetgroup/qeet-id-context (L1).

schema_version: 1

context: {type: repository, level: L2, canonical: true, last_verified: "2026-10-23"}

inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}

repository:
  name: qeet-id-console
  product: qeet-id
  type: frontend
  role: primary
  status: active
  visibility: public
  default_branch: develop
  production_branch: main
  working_branch: develop
  host: console.id.qeet.in

runtime:
  language: TypeScript
  framework: TanStack Start   # ^1.168 + TanStack Router ^1.170
  react: "^19.2.6"
  bundler: vite ^8            # + nitro (Vercel Build Output)
  package_manager: bun@1.3.14
  styling: tailwindcss ^4.3
  design_system: "@qeetrix/ui 2.1.5 + @qeetrix/icons 1.0.11"   # pinned exactly

architecture:
  style: layered-with-enforced-boundaries
  layers: [app, modules, platform, shared]      # app = composition root (module list, route tree, manifests)
  enforcement:
    mechanism: biome-noRestrictedImports        # + noImportCycles: error, + src/__tests__/module-boundaries.test.ts
    config: biome.json
    command: bun run lint:boundaries
  modules: 18                                   # src/modules/, listed in src/app/modules.ts; each has an index.ts barrel and a manifest.tsx
  new_module: bun run new-module <id>           # scripts/new-module.mjs
  platform_dirs: [api, auth, components, config, errors, feature-flags, forms, keyboard, modules, query, security, telemetry, theme]
  route_rule: "route files (src/modules/*/routes/**, src/routes/**) may not import module internals, api() or @tanstack/react-query; no route is exempt"
  network_exits: "global fetch/EventSource/WebSocket/XMLHttpRequest are banned outside src/platform/api; both SSE streams use its event-stream.ts"

session:
  model: server-resolved-BFF                    # tokens stay in the encrypted cookie
  cookie: __Host-qeet_console                   # qeet_console_dev when not secure
  chunked: true                                 # __chunked__<n> + name.1..N
  tokens_reach_browser: false                   # PublicSession only
  max_age_days: 30
  csrf: createCsrfMiddleware (src/start.ts)
  idle_logout_minutes: 10                       # from the newest activity in any tab (auth/idle-activity.ts); UX only

authorization:
  model: UX-only                                # the backend is authoritative
  capabilities: 25
  source: GET /v1/users/{userId}/tenants/{tenantId}/permissions
  fails: closed                                 # malformed payload throws
  step_up_prompt: SensitiveActionProvider        # mounted in _app and /account
  step_up: RequireRecentMFA on the backend      # prompt: SensitiveActionProvider

contracts:
  consumes: {api: qeet-id-server}
  browser_base_url_env: PUBLIC_API_URL          # runtime (platform/config/api-base-url.ts), falls back to build-time VITE_API_URL (Vercel); federation/metadata URLs only
  server_base_url_env: SERVER_URL               # the BFF's backend origin
  ssrf_guard: src/platform/api/server-request-policy.ts
  production_config_check: src/platform/config/server-config.ts   # called from src/start.ts; every request fails with a named problem until fixed

commands:
  dev:   bun run dev          # vite dev on port 3002 (matches qeet-id-server APP_BASE_URL)
  build: bun run build
  test:  bun run test
  coverage: bun run test:coverage   # thresholds in vitest.config.ts; CI runs this
  e2e: bun run test:e2e             # build + Playwright: session, tenant isolation, CSP, accessibility (tests/e2e); CI job "Session E2E"
  audit: bun run audit              # known high/critical vulnerabilities; one documented ignore (QTRX-4)
  check: bun run check
  boundaries: bun run lint:boundaries

ci:
  workflows: [ci.yml, deploy.yml, codeql.yml, dependency-audit.yml, docker.yml]
  job: verify                 # name "Verify" is the required check on main; typecheck, check, lint:boundaries, test:coverage, build
  dependency_review: ci.yml job on pull requests (fails on high/critical)
  dependency_audit: dependency-audit.yml — push, PR and daily; not a required check
  image_check: docker.yml — builds and smoke-tests the image on PRs that touch it
  dependency_updates: .github/dependabot.yml (bun, github-actions, docker; 3-day cooldown)
  actions_pinned_to_sha: true
  runner: ubuntu-latest
  deploy: push main -> gate (same as Verify) -> vercel build/deploy --prod -> tag vX.Y.Z + GitHub release (release/x.y.z merge -> exactly vx.y.z; job runs only on main)
  release_image: "ci.yml job `image` — push to release/** after verify: ghcr.io/qeetgroup/qeet-id-console:sha-<commit>, linux/amd64+arm64 (consumed by the Qeet ID Kit, qeet-id-kit)"
container:
  dockerfile: Dockerfile      # Nitro node-server; not used by Vercel production
  runtime_env: [SERVER_URL, SESSION_SECRET, PUBLIC_API_URL, PORT, HOST]
  health: GET /healthz -> 200

security:
  sensitive_paths:
    - src/platform/auth/server-session.ts       # encrypted session cookie
    - src/platform/api/server-proxy.ts          # bearer attachment, refresh
    - src/platform/api/server-request-policy.ts # SSRF guard
    - src/platform/security/                    # capability model, step-up
    - src/platform/telemetry/redact.ts          # PII/secret redaction
    - src/platform/telemetry/server-log.ts      # production log (stdout); server-only
    - src/platform/telemetry/client-report.ts   # browser report endpoint: Zod allowlist, bounds
    - src/platform/errors/user-message.ts       # backend message leak-stop
    - src/platform/auth/scoped-storage.ts       # per-person/tenant browser storage, wiped on sign-out
    - src/platform/security/security-headers.ts # response headers (applied via Nitro route rules)
    - src/platform/config/server-config.ts      # production config check
  never: [render backend error.message, store a token in the browser, treat UI capabilities as enforcement, keep person or tenant data in unscoped browser storage]

llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  subsystems: docs/llm/subsystems.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
