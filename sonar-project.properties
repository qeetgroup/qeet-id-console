# SonarQube analysis of the console, on the local SonarQube qeet-id-server runs (make sonar-up
# there): `bun run sonar` runs the unit tests with coverage, then the scanner. Generated code, copy,
# static files and build output are left out, and so are .env and .env.* by name, so local keys
# are never analysed even if the scanner can't read .gitignore.
sonar.projectKey=qeet-id-console
sonar.projectName=Qeet ID console
sonar.sourceEncoding=UTF-8

# A file is code or a test, never both: tests are left out of the code.
sonar.sources=src,scripts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/routeTree.gen.ts,src/platform/api/contract/generated/*.gen.ts,src/i18n/locales/**,public/**,**/node_modules/**,coverage/**,dist/**,.output/**,test-results/**,**/.env,**/.env.*
sonar.tests=src,scripts,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,tests/**
sonar.test.exclusions=**/node_modules/**,**/.env,**/.env.*

# Coverage from `bun run test:coverage`, which measures src only: the build scripts, the test setup
# and type declarations have none to report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,src/test-setup.ts,**/*.d.ts,**/*.d.mts

# The type-aware TypeScript rules read the project's types.
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.working.directory=.scannerwork
