# Monthly updates into develop, each held back 3 days after release: a compromised version is
# usually pulled from npm within that window. They reach production with the next monthly release.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    commit-message:
      prefix: chore(deps)
    # TanStack Start 1.169 removed the session helpers the console's server session is built on, and
    # Router moves with Start: both stay where they are until the session code moves off them.
    ignore:
      - dependency-name: "@tanstack/react-start"
        versions: [">=1.169.0"]
      - dependency-name: "@tanstack/react-router"
        versions: [">=1.170.43"]
      # From 0.4.0 a table's row link is named by rowLabel but wraps the whole primary cell, so its
      # visible text isn't in its name (WCAG 2.5.3); the accessibility scan fails on it.
      - dependency-name: "@qeetrix/react"
        versions: [">=0.4.0"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # Released together; mixed versions break server rendering.
      tanstack:
        patterns: ["@tanstack/*"]
      qeetrix:
        patterns: ["@qeetrix/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    commit-message:
      prefix: ci(deps)
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  # Keeps the Dockerfile's digest-pinned base images current.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    commit-message:
      prefix: chore(deps)
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
