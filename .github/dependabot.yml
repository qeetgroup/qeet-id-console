# Weekly updates, each held back 3 days after release: a compromised version is
# usually pulled from npm within that window.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # Released together; mixed versions break server rendering.
      tanstack:
        patterns: ["@tanstack/*"]
      qeetrix:
        patterns: ["@qeetrix/*"]
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  # Keeps the Dockerfile's digest-pinned base images current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
