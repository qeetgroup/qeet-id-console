name: deploy

# Merging into main deploys console.id.qeet.in. Only a merged pull request from release or a hotfix/* branch whose
# Verify passed ships. After the site answers, the release is tagged (scripts/next-version.sh), and release and
# develop are brought level with main. Run it by hand on main to deploy main again, or give it a tag to put an earlier
# release back.
#
# Settings → Secrets and variables → Actions: the VERCEL_TOKEN secret; the VERCEL_ORG_ID and VERCEL_PROJECT_ID
# variables.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: An earlier release to put back, for example v0.1.0 (leave empty to deploy main)
        type: string
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag the release; bring release and develop level with main
      pull-requests: read # the merged pull request
      checks: read # its Verify
    environment:
      name: production
      url: https://console.id.qeet.in
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0 # the tags, for the version
          persist-credentials: false

      - name: What ships
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ -n "$TAG" ]; then
            [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "The tag must look like v0.1.0, not $TAG."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || fail "$TAG never went live."
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "### Putting $TAG back" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty | "\(.number) \(.head.ref) \(.head.sha)"')
          [ -n "$pr" ] || fail "main's latest commit didn't come from a merged pull request."
          read -r number head head_sha <<< "$pr"
          [ "$head" = release ] || [[ $head == hotfix/* ]] || fail "#$number came from $head; main takes release or hotfix/*."
          verify=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=Verify" \
            --jq '.check_runs | sort_by(.completed_at) | last | .conclusion // ""')
          [ "$verify" = success ] || fail "#$number: Verify is ${verify:-missing}; only a tested release ships."

          live=$(git tag --points-at HEAD --list 'v*' | head -1)
          if [ -n "$live" ]; then
            echo "version=$live" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "### Shipping $head (#$number)" >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build and deploy to Vercel
        env:
          # Nitro detects Vercel only on Vercel's builders; the preset makes the build emit .vercel/output.
          NITRO_PRESET: vercel
        run: |
          npm install --global vercel@65.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: console.id.qeet.in answers
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 6 --retry-all-errors --max-time 20 \
            https://console.id.qeet.in/healthz | grep -q '"status":"ok"'

      # Tagged only after the site answers, so every tag is a release that went live.
      - name: Tag the release
        if: steps.plan.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes
          echo "### $VERSION is live on https://console.id.qeet.in" >> "$GITHUB_STEP_SUMMARY"

      # Each moves up to main when it has nothing new (the usual case); otherwise main is merged into it.
      - name: Bring release and develop level with main
        if: steps.plan.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in release develop; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -f sha="$GITHUB_SHA" -F force=false > /dev/null 2>&1; then
              echo "$branch moved up to main." >> "$GITHUB_STEP_SUMMARY"
            elif gh api -X POST "repos/$GITHUB_REPOSITORY/merges" -f base="$branch" -f head="$GITHUB_SHA" \
              -f commit_message="Merge main into $branch" > /dev/null; then
              echo "main merged into $branch." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::main and $branch conflict: merge main into $branch by hand."
            fi
          done
