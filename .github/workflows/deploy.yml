name: deploy

on:
  push:
    branches: [main] # every merge to main gates, deploys, then tags
  workflow_dispatch:
    inputs:
      bump:
        description: Which version part to increment
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; the deploy job asks for what it needs.
permissions:
  contents: read

jobs:
  deploy:
    # A manual run on any other branch does nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the version tag + release after a successful deploy
      pull-requests: read # find the merged release/x.y.z pull request (version)
    environment:
      name: production
      url: https://console.id.qeet.in
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history to find the latest tag
          # The tag is created through the API, so no credentials stay on disk.
          persist-credentials: false

      - name: Determine next version
        id: version
        env:
          # Passed through env so the script never interpolates input.
          BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git tag --list 'v*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}
          # A merged release/x.y.z pull request releases exactly x.y.z, so every
          # Qeet ID repository tags the same product version
          # (qeet-id-kit: docs/release-process.md).
          head=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.ref][0] // ""')
          fi
          if [[ $head =~ ^release/([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            new_tag="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            if git rev-parse -q --verify "refs/tags/$new_tag" > /dev/null; then
              echo "::error::$new_tag already exists"
              exit 1
            fi
            if [ "$(printf '%s\n' "${latest#v}" "${new_tag#v}" | sort -V | tail -1)" != "${new_tag#v}" ]; then
              echo "::error::$head is not newer than $latest"
              exit 1
            fi
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) new_tag="v$((major + 1)).0.0" ;;
              minor) new_tag="v${major}.$((minor + 1)).0" ;;
              *)     new_tag="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Latest: $latest  ->  new: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same gate as ci.yml's Verify, against a bad merge.
      - name: Typecheck
        run: bun run typecheck

      - name: Format + lint (Biome)
        run: bun run check

      - name: Architecture boundaries
        run: bun run lint:boundaries

      - name: Unit tests + coverage thresholds
        run: bun run test:coverage

      # Pinned: `latest` would run whatever was last published, with the deploy token.
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0

      # VERCEL_TOKEN reaches only the Vercel steps, through env, never the command line.
      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          # Nitro detects Vercel only on Vercel's builders; pin the preset so the build
          # emits .vercel/output, which `vercel build` expects.
          NITRO_PRESET: vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # The attest job signs this list of what Vercel serves. Only hashes leave the job: the
      # output was built with the production environment pulled.
      - name: Checksum the build output
        working-directory: .vercel/output
        run: |
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/vercel-output.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-output-checksums
          path: ${{ runner.temp }}/vercel-output.sha256
          if-no-files-found: error

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Tagged after the deploy succeeds, so every tag is a live version. `gh release
      # create` tags the deployed commit itself.
      - name: Create version tag and GitHub release
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  sbom:
    name: SBOM
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml

  # Signs the deploy's provenance and SBOM. Kept out of the deploy job so no dependency code
  # runs where an OIDC token can be minted; a failed SBOM still leaves the provenance.
  attest:
    name: Attest
    needs: [deploy, sbom]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-output-checksums

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: vercel-output.sha256

      - if: needs.sbom.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Attest SBOM
        if: needs.sbom.result == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: vercel-output.sha256
          sbom-path: sbom.cdx.json
