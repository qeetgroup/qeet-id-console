name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format + lint (Biome)
        run: bun run check

      - name: Architecture boundaries
        run: bun run lint:boundaries

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  # Release branches only: publish one immutable, commit-addressed image
  # (ghcr.io/qeetgroup/qeet-id-console:sha-<commit>) after Verify passes. No rc.N
  # is computed here — qeet-id-deploy assembles the product release candidate
  # (qeet-id-deploy: docs/test-kit/application-contract.md). Production keeps
  # deploying to Vercel from deploy.yml; this job does not touch it.
  image:
    name: Release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          release="${REF_NAME#release/}"
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release branches must be named release/x.y.z (got $REF_NAME)"
            exit 1
          fi
          {
            echo "release=$release"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile builds once on the runner's platform (Nitro output is plain
      # JavaScript), so no QEMU is needed for the arm64 image.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE: ${{ steps.meta.outputs.release }}
          CREATED: ${{ steps.meta.outputs.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA"
          # sha-<commit> tags are immutable: a re-run must not move them.
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::notice::$ref already published; leaving it untouched."
            exit 0
          elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "::error::cannot check $ref: $out"
            exit 1
          fi
          labels=(
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.revision=$GITHUB_SHA"
            "org.opencontainers.image.version=$RELEASE"
            "org.opencontainers.image.created=$CREATED"
            "in.qeet.release=$RELEASE"
            "in.qeet.source-branch=$REF_NAME"
          )
          args=()
          for l in "${labels[@]}"; do args+=(--label "$l" --annotation "index:$l"); done
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$RELEASE" \
            --build-arg REVISION="$GITHUB_SHA" \
            "${args[@]}" \
            --tag "$ref" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          {
            echo "### Release image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$ref\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Release | \`$RELEASE\` |"
            echo
            echo "Assemble a product RC in qeet-id-deploy → Actions → **publish-candidate** with console = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
