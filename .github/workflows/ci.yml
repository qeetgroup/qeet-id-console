name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  # The checks run side by side: the quick ones, the unit tests in four shards, and the build. The
  # unit tests were most of the wait (8 of 11 minutes as one job), so they're split.
  checks:
    name: Typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format + lint (Biome)
        run: bun run check

      - name: Architecture boundaries
        run: bun run lint:boundaries

  # Each shard runs a quarter of the test files with coverage and keeps its report; the floors
  # (vitest.config.ts) are checked on the merged report in `unit-coverage`, not on a slice.
  unit:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests, shard ${{ matrix.shard }} of 4
        env:
          COVERAGE_SHARD: "1"
        run: bunx vitest run --shard=${{ matrix.shard }}/4 --reporter=blob --coverage

      # .vitest is a hidden folder, which upload-artifact leaves out unless asked.
      - name: Keep the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-report-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  unit-coverage:
    name: Unit coverage
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-report-*
          path: .vitest/blob
          merge-multiple: true

      - name: Every shard's result, and the coverage floors on the whole
        run: bunx vitest run --merge-reports --coverage

  build:
    name: Build + bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # The shell's initial JS and each route's own JS against bundle-budgets.json (gzip).
      - name: Bundle budgets
        run: bun run size

  # "Verify" is the required status check on main; keep the name. It passes only when every part
  # above passed (a skipped or cancelled part counts as not passed).
  verify:
    name: Verify
    needs: [checks, unit-coverage, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::Not every check passed: $RESULTS"
              exit 1
            fi
          done

  # Every Playwright spec in tests/e2e against the production build: the session boundary, the
  # Content-Security-Policy and the WCAG 2.2 AA accessibility scan, so a violation fails the pull
  # request.
  # No retries: a flake is a bug.
  e2e:
    name: Session E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build + browser tests
        run: bun run test:e2e

      # The trace holds DOM snapshots, network and console for diagnosis.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Refuses a pull request that adds a dependency with a high or critical advisory.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Publishes ghcr.io/qeetgroup/qeet-id-console:sha-<commit> from release/** for the
  # Qeet ID Kit (qeet-id-kit). Production deploys to Vercel from deploy.yml.
  image:
    name: Release image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          release="${REF_NAME#release/}"
          if ! [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release branches must be named release/x.y.z (got $REF_NAME)"
            exit 1
          fi
          {
            echo "release=$release"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/$GITHUB_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

      # Nitro output is plain JavaScript, so the arm64 image needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          RELEASE: ${{ steps.meta.outputs.release }}
          CREATED: ${{ steps.meta.outputs.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="$IMAGE:sha-$GITHUB_SHA"
          # The index digest, for the attest job.
          publish_digest() {
            if ! [[ $1 =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no image digest for $ref (got '$1')"
              exit 1
            fi
            echo "digest=$1" >> "$GITHUB_OUTPUT"
          }
          # sha-<commit> tags are immutable: a re-run must not move them.
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "::notice::$ref already published; leaving it untouched."
            publish_digest "$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
            exit 0
          elif ! grep -qiE 'not found|manifest unknown' <<<"$out"; then
            echo "::error::cannot check $ref: $out"
            exit 1
          fi
          labels=(
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.revision=$GITHUB_SHA"
            "org.opencontainers.image.version=$RELEASE"
            "org.opencontainers.image.created=$CREATED"
            "in.qeet.release=$RELEASE"
            "in.qeet.source-branch=$REF_NAME"
          )
          args=()
          for l in "${labels[@]}"; do args+=(--label "$l" --annotation "index:$l"); done
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$RELEASE" \
            --build-arg REVISION="$GITHUB_SHA" \
            "${args[@]}" \
            --tag "$ref" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            --push
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          publish_digest "$digest"
          {
            echo "### Release image"
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$ref\` |"
            echo "| Digest | \`$digest\` |"
            echo "| Release | \`$RELEASE\` |"
            echo
            echo "Assemble a product RC in qeet-id-kit → Actions → **publish-candidate** with console = \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

  image-sbom:
    name: Release image SBOM
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: read
    uses: ./.github/workflows/sbom.yml

  # Signs the published image's provenance and SBOM. Kept out of the image job so no build or
  # dependency code runs where an OIDC token can be minted; a failed SBOM still leaves the
  # provenance.
  image-attest:
    name: Attest release image
    needs: [image, image-sbom]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestations
    steps:
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}

      - if: needs.image-sbom.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Attest SBOM
        if: needs.image-sbom.result == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.image.outputs.image }}
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom.cdx.json
