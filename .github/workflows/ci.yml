name: ci

# Tests run once for each change. A pull request into develop, a fix into release, or a hotfix/* into main runs every
# check, the browser tests included. A promotion (develop into release, release into main) skips them when that code is
# already tested: every commit passed Verify in a pull request into develop or release, and the last of those was up to
# date when it merged. Otherwise (a direct push, or the branch moving on after a pull request was tested) it runs them
# once on the whole promotion.
on:
  pull_request:
    branches: [develop, release, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the commits of a promotion
      checks: read # whether each passed Verify on its way in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the version a release gets
          persist-credentials: false

      - name: Promotion
        id: promotion
        if: github.base_ref != 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || fail "$BASE takes branches of this repository only, not $HEAD_REPO."
          if [ "$BASE" = main ]; then
            [ "$HEAD" = release ] || [[ $HEAD == hotfix/* ]] || fail "main takes release or a hotfix/* branch, not $HEAD."
            echo "### Merging $HEAD releases $(scripts/next-version.sh)" >> "$GITHUB_STEP_SUMMARY"
            from=release
          else
            [ "$HEAD" != main ] || fail "release takes develop, or a fix branch; main comes back by itself after a release."
            echo "### Merging $HEAD into release, which becomes $(scripts/next-version.sh)" >> "$GITHUB_STEP_SUMMARY"
            from=develop
          fi
          [ "$HEAD" = "$from" ] || exit 0 # a fix or a hotfix is new code: test it

          untested=""
          for sha in $(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[].sha'); do
            tested=false
            for head in $(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '.[] | select(.merged_at != null and (.base.ref == "develop" or .base.ref == "release")) | .head.sha'); do
              verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?check_name=Verify" \
                --jq '.check_runs | sort_by(.completed_at) | last | .conclusion // ""')
              if [ "$verdict" = success ]; then tested=true; break; fi
            done
            [ "$tested" = true ] || untested="$untested ${sha:0:7}"
          done
          if [ -n "$untested" ]; then
            echo "Not tested on the way in:$untested. Running every check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Each pull request was tested against its base as it was then. $HEAD is that tested state only if the
          # last one was up to date when it merged: then $HEAD's files are exactly its branch's files.
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"$HEAD\")][0] // empty | \"\(.number) \(.head.sha)\"")
          read -r number last_head <<< "$last"
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          if [ -n "$last_head" ] && [ "$(tree "$HEAD_SHA")" = "$(tree "$last_head")" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "Every commit passed Verify on its way in, so nothing runs again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$HEAD changed after #${number:-?} was tested. Running every check once." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.promotion.outputs.tested != 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.promotion.outputs.tested != 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.promotion.outputs.tested != 'true'
        run: bun run typecheck

      - name: Format and lint
        if: steps.promotion.outputs.tested != 'true'
        run: bun run check

      - name: Architecture boundaries
        if: steps.promotion.outputs.tested != 'true'
        run: bun run lint:boundaries

      # Known high and critical advisories in the installed dependencies.
      - name: Dependency audit
        if: steps.promotion.outputs.tested != 'true'
        run: bun run audit

      - name: Tests with coverage floors
        if: steps.promotion.outputs.tested != 'true'
        run: bun run test:coverage

      - name: Build
        if: steps.promotion.outputs.tested != 'true'
        run: bun run build

      # The signed-in shell's and each route's JavaScript against bundle-budgets.json.
      - name: Bundle budgets
        if: steps.promotion.outputs.tested != 'true'
        run: bun run size

      # That build under its Content-Security-Policy, the session boundary and the WCAG 2.2 AA scan, in a
      # real browser against the fake backend.
      - name: Browser tests
        if: steps.promotion.outputs.tested != 'true'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test
