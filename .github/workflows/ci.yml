name: ci

# Checks run once for each change: typecheck, format and lint, and the dependency audit. A pull request into develop or
# main runs them, and so does every push to a release/YEAR.MONTH.0 or hotfix/YEAR.MONTH.N branch (candidate.yml calls
# this before building the test image). A release or hotfix branch into main is therefore already tested: when its
# candidate build passed for that exact commit and the branch holds everything on main, nothing runs again. The unit
# tests, the browser tests and the build run locally before a change is pushed (AGENTS.md, "Before you finish").
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # whether the candidate build passed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        id: promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || fail "main takes branches of this repository only, not $HEAD_REPO."
          case "$HEAD" in
            release/* | hotfix/*) ;;
            *)
              echo "### $HEAD into main is not a release: verifying it, and deploy.yml will deploy nothing" >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          release=$(scripts/release/version.sh "$HEAD") || fail "$HEAD can't be released (see above)."
          echo "### Merging $HEAD releases v$release" >> "$GITHUB_STEP_SUMMARY"
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/candidate.yml/runs?head_sha=$HEAD_SHA&status=success" --jq .total_count)
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD_SHA" --jq .behind_by)
          if [ "$passed" -gt 0 ] && [ "$behind" = 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "It passed Verify in its candidate build and holds all of main, so nothing runs again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verifying it (passed candidate builds of this commit: $passed; commits on main it lacks: $behind)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.promotion.outputs.tested != 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.promotion.outputs.tested != 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.promotion.outputs.tested != 'true'
        run: bun run typecheck

      # Biome: formatting, lint, and the import rules that keep each layer to its own.
      - name: Format and lint
        if: steps.promotion.outputs.tested != 'true'
        run: bun run check

      # Known high and critical advisories in the installed dependencies.
      - name: Dependency audit
        if: steps.promotion.outputs.tested != 'true'
        run: bun run audit
