name: candidate

# A push to release/YEAR.MONTH.0 or hotfix/YEAR.MONTH.N builds the image the Qeet ID Kit runs in TEST and STAGING,
# once per commit: ghcr.io/qeetgroup/qeet-id-console:sha-<commit>, for linux/amd64 and linux/arm64,
# labelled with its release and branch. The kit numbers the test copies (YEAR.MONTH.N-rc.K); this workflow never does.
# Verify runs once, on the branch's pull request into main. A fix is made on develop first and then copied to the
# release branch, so nothing has to come back from it.
on:
  push:
    branches: ["release/**", "hotfix/**"]

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false # every pushed commit gets its image

permissions:
  contents: read

jobs:
  image:
    name: Test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! release=$(scripts/release/version.sh "$REF_NAME"); then
            echo "::error::$REF_NAME is not a release/YEAR.MONTH.0 or hotfix/YEAR.MONTH.N branch (see above)."
            exit 1
          fi
          {
            echo "release=$release"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      # The Dockerfile builds natively for each target, so no QEMU is needed for arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.plan.outputs.release }}
          CREATED: ${{ steps.plan.outputs.created }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="ghcr.io/$GITHUB_REPOSITORY:sha-$GITHUB_SHA"
          # sha-<commit> tags never move: a re-run leaves a published one alone.
          if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "### $ref is already published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          labels=(
            "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
            "org.opencontainers.image.revision=$GITHUB_SHA"
            "org.opencontainers.image.version=$RELEASE"
            "org.opencontainers.image.created=$CREATED"
            "in.qeet.release=$RELEASE"
            "in.qeet.source-branch=$REF_NAME"
          )
          args=()
          for l in "${labels[@]}"; do args+=(--label "$l" --annotation "index:$l"); done
          docker buildx build . --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$RELEASE" --build-arg REVISION="$GITHUB_SHA" \
            "${args[@]}" --tag "$ref" --push
          echo "### Test image $ref ($RELEASE, from $REF_NAME)" >> "$GITHUB_STEP_SUMMARY"
