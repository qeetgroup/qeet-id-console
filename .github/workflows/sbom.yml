name: SBOM

# Reusable: a CycloneDX SBOM of the production dependency tree (no devDependencies), uploaded
# as the `sbom` artifact. deploy.yml and ci.yml attest it with what they ship; docker.yml runs
# it so a lockfile change that breaks it fails on its pull request.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The SBOM reads only the installed tree, so no install script needs to run.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # cyclonedx-npm reads node_modules through `npm ls`, which understands bun's hoisted layout.
      # Pinned like the Vercel CLI; this job holds no secret and a read-only token. No
      # --output-reproducible: it drops the serialNumber actions/attest needs to see CycloneDX.
      - name: Generate the SBOM
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: >-
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1
          --omit dev --validate
          --output-file sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
