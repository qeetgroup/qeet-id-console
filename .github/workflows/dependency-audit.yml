name: Dependency audit

# High and critical advisories in the dependency tree. Not a required check, so a new
# advisory for an existing dependency shows red without blocking merges.
# `bun run audit` ignores three advisories reached only through the shadcn CLI that @qeetrix/ui
# ships as a runtime dependency, which the console never runs or bundles: GHSA-vfj7-8cjw-p6xm
# (braces <= 3.0.3, no fix released), GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6: shadcn needs zod 3, which
# has no fix; the console's own zod is 4.6.7) and GHSA-27r3-jxmh-p828 (body-parser < 2.4.0, via
# @modelcontextprotocol/sdk and express). Drop them when QTRX-4 removes that dependency.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  schedule:
    - cron: "41 4 * * *" # daily: advisories are published independently of our commits

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit (high and critical)
        run: bun run audit
