name: Dependency audit

# High and critical advisories in the dependency tree. Not a required check, so a new
# advisory for an existing dependency shows red without blocking merges.
# `bun run audit` ignores GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3, no fix released), reached
# only via the shadcn CLI in @qeetrix/ui; drop the ignore once that dependency goes.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
  schedule:
    - cron: "41 4 * * *" # daily: advisories are published independently of our commits

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit (high and critical)
        run: bun run audit
